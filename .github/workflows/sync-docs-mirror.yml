name: Sync docs mirror for Weblate

on:
  push:
    branches: [i18n]
    paths:
      - 'docs/**'
      - 'i18n/**'
      - 'scripts/i18n-utils.mjs'
      - 'scripts/sync-docs-mirror.mjs'
      - 'scripts/sync-docs-mirror.sh'
      - '.github/workflows/sync-docs-mirror.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-docs-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run mirror sync
        run: node scripts/sync-docs-mirror.mjs

      - name: Commit and push if changed
        run: |
          git add -- ':(glob)i18n/*/docusaurus-plugin-content-docs/current/**'
          if git diff --cached --quiet; then
            echo "Mirror already up to date."
            exit 0
          fi
          git commit -m "chore(i18n): sync docs/ mirror for Weblate"
          git push origin i18n
